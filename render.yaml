services:
  - type: web
    name: mega-md
    runtime: node
    plan: standard
    buildCommand: npm ci
    startCommand: npm run start:render
    healthCheckPath: /health
    disk:
      name: mega-md-session
      mountPath: /opt/render/project/src/session
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_RSS_MB
        value: "1700"
      - key: PAIRING_PAGE_PASSWORD
        sync: false
      - key: SESSION_ID
        sync: false
      - key: OWNER_NUMBER
        sync: false
      - key: BOT_NAME
        value: "MEGA-MD"
      - key: COMMAND_MODE
        value: "public"
      - key: TIMEZONE
        value: "Asia/Karachi"
      - key: MONGO_URL
        value: ""
      - key: POSTGRES_URL
        value: ""
      - key: MYSQL_URL
        value: ""
      - key: DB_URL
        sync: false
      - key: AI_PROXY_API_KEY
        sync: false
      - key: CHATBOT_API_KEY
        sync: false
      - key: GIPHY_API_KEY
        sync: false
      - key: REMOVEBG_KEY
        sync: false
